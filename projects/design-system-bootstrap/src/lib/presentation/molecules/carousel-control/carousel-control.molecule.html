<nav class="dsb-carousel-control d-flex align-items-center justify-content-center gap-3" aria-label="Controles del carrusel">
  <button
    type="button"
    class="btn btn-outline-secondary dsb-carousel-control__btn dsb-carousel-control__btn--prev d-inline-flex align-items-center justify-content-center"
    [disabled]="isPrevDisabled"
    [attr.aria-label]="prevAriaLabel"
    (click)="onPrev()">
    <dsb-icon-atom [icon]="prevIcon" [size]="1.1"></dsb-icon-atom>
  </button>

  @if (currentTotal > 0) {
    <div class="dsb-carousel-control__indicators d-flex align-items-center gap-2">
      @for (item of indicatorsArray; track item) {
        <dsb-dot-indicator-atom
          [index]="item"
          [active]="item === currentIndex"
          (dotClick)="onDotClick($event)">
        </dsb-dot-indicator-atom>
      }
    </div>
  }

  <button
    type="button"
    class="btn btn-outline-secondary dsb-carousel-control__btn dsb-carousel-control__btn--next d-inline-flex align-items-center justify-content-center"
    [disabled]="isNextDisabled"
    [attr.aria-label]="nextAriaLabel"
    (click)="onNext()">
    <dsb-icon-atom [icon]="nextIcon" [size]="1.1"></dsb-icon-atom>
  </button>
</nav>
